# Published baseline (starter/baseline.py) on the Tracking contract: nearest player to the ball,
# majority vote over +/- 25 frames. Reproduces evaluation/results/baseline_smooth25.csv exactly.
name: baseline_smooth25
tracking: atd            # "atd", or the path of a Tracking .npz (Line B's ATD+)
pipeline:
  method: baseline_nearest
  params:
    window: 25
